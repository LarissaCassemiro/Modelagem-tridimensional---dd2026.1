<html>
  <head>
    <title>Terceira experiência de RA AR.js com marcador Hiro</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene vr-mode-ui="enabled: false" embedded arjs="debugUIEnabled: false">
        <a-assets>
          <a-asset-item id="suzze" src="suzzane.glb"></a-asset-item>
        </a-assets>
      <a-marker preset="hiro">
        <a-entity
          id="modelo3d"
          position="0 0 0"
          rotation="90 0 0"
          scale="0.5 0.56 0.50"
          gltf-model="#suzze"></a-entity>
     <a-entity
          id="modelo3d"
          position="0 0 0"
          rotation="90 0 90"
          scale="0.5 0.56 0.50"
          gltf-model="#suzze"></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
